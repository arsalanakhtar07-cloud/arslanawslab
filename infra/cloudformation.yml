AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 and CloudFront hosting with a least-privilege GitHub Actions OIDC deployment role.

Parameters:
  GitHubOwner:
    Type: String
    Default: arsalanakhtar07-cloud
    AllowedPattern: "[A-Za-z0-9_.-]+"
  GitHubRepository:
    Type: String
    Default: arslanawslab
    AllowedPattern: "[A-Za-z0-9_.-]+"
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing token.actions.githubusercontent.com OIDC provider ARN, if the account already has one.

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: arslanawslab

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Private access from Arslan AWS Lab CloudFront distribution to S3
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Arslan AWS Lab static website
        DefaultCacheBehavior:
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          TargetOriginId: private-s3-origin
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            Id: private-s3-origin
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        PriceClass: PriceClass_100
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 60
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 404
            ErrorCachingMinTTL: 60
            ResponseCode: 404
            ResponsePagePath: /404.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: arslanawslab

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: arslanawslab

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Allows the arslanawslab main branch to deploy the static website.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/main"
      Policies:
        - PolicyName: DeployStaticWebsite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListWebsiteBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt WebsiteBucket.Arn
              - Sid: ManageWebsiteObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${WebsiteBucket.Arn}/*"
              - Sid: RefreshCloudFront
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
      Tags:
        - Key: Project
          Value: arslanawslab

Outputs:
  BucketName:
    Description: Private S3 bucket receiving the built website.
    Value: !Ref WebsiteBucket
  CloudFrontDistributionId:
    Description: CloudFront distribution invalidated after every deployment.
    Value: !Ref Distribution
  CloudFrontDomainName:
    Description: Public CloudFront domain name.
    Value: !GetAtt Distribution.DomainName
  CloudFrontUrl:
    Description: Public HTTPS website URL.
    Value: !Sub "https://${Distribution.DomainName}"
  GitHubActionsRoleArn:
    Description: OIDC role assumed by GitHub Actions.
    Value: !GetAtt GitHubActionsRole.Arn

