<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found | Arslan AWS Lab</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#071a2b">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="/styles.css">
    <style>
      .not-found { min-height: 100vh; display: grid; place-items: center; padding: 30px; text-align: center; }
      .not-found-card { max-width: 650px; padding: clamp(35px, 8vw, 75px); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--card); box-shadow: var(--shadow); }
      .not-found-code { margin: 0; color: var(--cyan-soft); font-size: clamp(4rem, 18vw, 8rem); font-weight: 900; line-height: 1; letter-spacing: -0.08em; }
      .not-found h1 { margin: 18px 0 10px; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.05; }
      .not-found p { margin: 0 auto 28px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div class="not-found-card">
        <p class="not-found-code">404</p>
        <h1>This cloud has no page.</h1>
        <p>The address may have changed, but Arslan AWS Lab is still live.</p>
        <a class="button button-primary" href="/">Return home <span aria-hidden="true">☁️</span></a>
      </div>
    </main>
  </body>
</html>
